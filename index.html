<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Operation REBIRTH</title>
  <!-- installable: "Add to Home Screen" opens the game full screen, including on iPhone -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b0a14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="REBIRTH">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <style>
    :root { --bg: #0b0a14; --ink: #f0f2f3; --muted: #8a87a3; }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #0b0a14; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: 'Press Start 2P', monospace; }
    #game { width: 100vw; height: 100vh; }
    #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    /* phones: no page scrolling, zooming or text selection while playing */
    html, body, #game, #game canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: var(--bg); color: var(--ink); align-items: center; justify-content: center; text-align: center; font-size: 12px; line-height: 2; padding: 24px; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); pointer-events: none; }
  </style>
</head>
<body>
  <div id="loading">LOADING...</div>
  <div id="rotate">TURN YOUR PHONE SIDEWAYS<br>TO PLAY</div>
  <div id="game"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
