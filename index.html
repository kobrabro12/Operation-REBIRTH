<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Operation REBIRTH</title>
  <!-- installable: "Add to Home Screen" opens the game full screen, including on iPhone -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b0a14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="REBIRTH">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <!-- start fetching the pixel font right away (src/fonts/fonts.css declares it) -->
  <link rel="preload" href="./src/fonts/press-start-2p-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./src/fonts/fonts.css">
  <style>
    :root { --bg: #0b0a14; --ink: #f0f2f3; --muted: #8a87a3; }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #0b0a14; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: 'Press Start 2P', monospace; }
    #game { width: 100vw; height: 100vh; }
    #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    /* phones: no page scrolling, zooming or text selection while playing */
    html, body, #game, #game canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: var(--bg); color: var(--ink); align-items: center; justify-content: center; text-align: center; font-size: 12px; line-height: 2; padding: 24px; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    /* THE LOADING SCREEN (public/loading-screens.js picks one; art from tools/sprites/loading_screens.py): a pixel
       backdrop pushing in, light rays turning behind a big hero who slides in and floats, particles, the name, tips
       and a slanted bar. BootScene fills #loading-fill / #loading-percent and fades it out (.ready). */
    #loading { position: fixed; inset: 0; z-index: 9; overflow: hidden; background: #0b0912; pointer-events: none; opacity: 1; transition: opacity 260ms ease, transform 260ms ease; --a: #ffd24a; --b: #ff3a8a; font-family: 'Press Start 2P', monospace; color: #fff; }
    #loading.ready { opacity: 0; transform: scale(1.04); }
    .ls-stage { position: absolute; left: 50%; top: 50%; width: max(100vw, 177.78vh); height: max(100vh, 56.25vw); transform: translate(-50%, -50%); }
    .ls-stage img { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; user-select: none; }
    .ls-bg { inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 62% 55%; animation: ls-push 16s cubic-bezier(.2,.6,.3,1) forwards; }
    .ls-rays { position: absolute; left: var(--hx, 64%); top: 52%; width: 160%; aspect-ratio: 1; transform: translate(-50%, -50%); background: repeating-conic-gradient(from 0deg, var(--a) 0deg 7deg, transparent 7deg 22deg); opacity: .22; mix-blend-mode: screen; -webkit-mask: radial-gradient(circle, #000 0%, transparent 46%); mask: radial-gradient(circle, #000 0%, transparent 46%); animation: ls-spin 60s linear infinite; }
    .ls-hero-wrap { position: absolute; left: var(--hx, 64%); bottom: var(--hb, 5%); height: var(--hh, 76%); transform: translateX(-50%); animation: ls-in .9s cubic-bezier(.2,1.4,.4,1) both .15s; }
    .ls-hero { position: relative !important; height: 100%; width: auto; animation: ls-float 3.6s ease-in-out infinite alternate 1s; filter: drop-shadow(.55vmin .55vmin 0 var(--b)) drop-shadow(0 0 2.4vmin var(--a)); }
    .ls-fx { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
    .ls-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(6,4,14,.82) 0%, rgba(6,4,14,.35) 34%, transparent 55%), linear-gradient(0deg, rgba(6,4,14,.85) 0%, transparent 26%), radial-gradient(ellipse at 60% 45%, transparent 55%, rgba(0,0,0,.45) 100%); }
    .ls-hud { position: absolute; inset: 0; }
    .ls-title { position: absolute; left: 4.5vw; bottom: 17vh; max-width: min(52vw, 95vh); animation: ls-title .7s cubic-bezier(.2,1.2,.4,1) both .35s; }
    .ls-kicker { display: inline-block; font-size: clamp(7px, 1vw, 13px); letter-spacing: .15em; padding: .6em .9em; background: var(--a); color: #120a1c; transform: skewX(-12deg); }
    .ls-name { margin: .35em 0 .25em; font-size: clamp(16px, min(5.2vw, 9vh), 78px); line-height: 1.05; font-weight: 400; transform: skewX(-8deg); color: #fff; text-shadow: .08em .08em 0 var(--b), .16em .16em 0 rgba(0,0,0,.55); }
    .ls-place { font-size: clamp(8px, 1.25vw, 17px); color: var(--a); letter-spacing: .08em; }
    .ls-lore { margin-top: .9em; font-size: clamp(6px, .85vw, 12px); line-height: 1.8; color: #d8d0ea; max-width: 34em; }
    .ls-tip { position: absolute; left: 4.5vw; right: 26vw; bottom: 10.2vh; display: flex; gap: 1em; align-items: center; font-size: clamp(6px, .9vw, 12px); color: #eae4f6; }
    .ls-tip b { font-weight: 400; padding: .45em .7em; background: rgba(255,255,255,.12); border-left: 3px solid var(--a); color: var(--a); }
    #ls-tip-text { transition: opacity .35s ease, transform .35s ease; }
    #ls-tip-text.out { opacity: 0; transform: translateY(.6em); }
    .loading-progress { position: absolute; left: 4.5vw; right: 4.5vw; bottom: 5.2vh; height: clamp(8px, 1.6vh, 18px); background: rgba(10,6,20,.75); border: 2px solid rgba(255,255,255,.18); transform: skewX(-24deg); overflow: hidden; }
    #loading-fill { position: relative; height: 100%; width: 0%; background: linear-gradient(90deg, var(--b), var(--a)); transition: width .25s ease-out; overflow: hidden; }
    #loading-fill::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.28) 0 6px, transparent 6px 18px); animation: ls-march .6s linear infinite; }
    #loading-fill::before { content: ''; position: absolute; top: 0; bottom: 0; width: 30%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); animation: ls-shine 1.6s ease-in-out infinite; z-index: 1; }
    .ls-status { position: absolute; right: 4.5vw; bottom: 8.2vh; display: flex; align-items: center; gap: .8em; font-size: clamp(7px, 1vw, 14px); }
    .ls-spin { width: 1.2em; height: 1.2em; background: var(--a); transform: rotate(45deg); animation: ls-diamond 1.1s cubic-bezier(.6,0,.4,1) infinite; box-shadow: 0 0 .8em var(--a); }
    #loading-percent { color: #fff; min-width: 4ch; text-align: right; }
    @keyframes ls-push { from { transform: scale(1.04) translate(1%, .5%); } to { transform: scale(1.14) translate(-1.2%, -1%); } }
    @keyframes ls-spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes ls-in { 0% { opacity: 0; transform: translateX(-10%) scale(.86) skewX(-6deg); filter: brightness(3); } 55% { opacity: 1; filter: brightness(1.4); } 100% { opacity: 1; transform: translateX(-50%) scale(1); filter: none; } }
    @keyframes ls-float { from { transform: translateY(0) rotate(-.6deg); } to { transform: translateY(-2.2%) rotate(.6deg); } }
    @keyframes ls-title { from { opacity: 0; transform: translateX(-6vw); } to { opacity: 1; transform: none; } }
    @keyframes ls-march { to { background-position: 18px 0; } }
    @keyframes ls-shine { from { left: -30%; } to { left: 110%; } }
    @keyframes ls-diamond { 0% { transform: rotate(45deg) scale(1); } 50% { transform: rotate(225deg) scale(.7); } 100% { transform: rotate(405deg) scale(1); } }
    @media (max-aspect-ratio: 4/3) { .ls-title { bottom: 20vh; max-width: 70vw; } .ls-lore { display: none; } }
    @media (prefers-reduced-motion: reduce) { #loading, #loading * { animation: none !important; transition: none !important; } .ls-hero-wrap { transform: translateX(-50%); } }
  </style>
</head>
<body>
  <div id="loading" aria-label="Loading Operation REBIRTH">
    <div class="ls-stage">
      <img class="ls-bg" alt="">
      <div class="ls-rays"></div>
      <div class="ls-hero-wrap"><img class="ls-hero" alt=""></div>
      <canvas class="ls-fx" width="320" height="180"></canvas>
      <div class="ls-shade"></div>
    </div>
    <div class="ls-hud">
      <div class="ls-title"><span class="ls-kicker">OPERATION REBIRTH</span><div class="ls-name"></div><div class="ls-place"></div><div class="ls-lore"></div></div>
      <div class="ls-status"><span>LOADING</span><span id="loading-percent" aria-hidden="true">0%</span><span class="ls-spin"></span></div>
      <div class="ls-tip"><b>TIP</b><span id="ls-tip-text"></span></div>
      <div id="loading-progress" class="loading-progress" role="progressbar" aria-label="Game assets" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="loading-fill"></div></div>
    </div>
  </div>
  <div id="rotate">TURN YOUR PHONE SIDEWAYS<br>TO PLAY</div>
  <div id="game"></div>
  <script src="/loading-screens.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
