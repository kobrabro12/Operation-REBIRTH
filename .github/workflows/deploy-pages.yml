name: Deploy to GitHub Pages

# Builds the game with Vite and publishes it every time main is pushed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - uses: actions/cache@v4            # MP3 copies the build encoded before (tools/build/mp3.mjs)
        with:
          path: node_modules/.cache/rebirth-mp3
          key: mp3-${{ hashFiles('public/**/*.ogg') }}
          restore-keys: mp3-
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
